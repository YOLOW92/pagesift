[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "llama-index-readers-pagesift"
version = "1.1.0"
description = "LlamaIndex reader for pagesift: web pages, sites and local files as Markdown, no API key."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = ["pagesift>=1.1,<2", "llama-index-core>=0.12,<1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/YOLOW92/pagesift"

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
