# 补发布：发布流程里 crates.io 遇到频率限制（新账号连发 5 个新包后，每 10 分钟只能发 1 个新包）时，
# 用它把剩下的发完。按依赖顺序逐个发布 Rust 包，已经发布的跳过，被限流就等到 crates.io 给出的时间再试；
# 然后取回那次发布流程里构建好的 npm 包发布到 npm，最后发布 GitHub 版本页面。
name: Publish rest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的版本标签，例如 v0.20.0
        required: true
      run_id:
        description: 那次发布流程的运行编号（npm 包的构建产物从这里取）
        required: true

permissions:
  contents: write
  actions: read

jobs:
  crates:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: crates.io（逐个发布，限流时等待）
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/publish_crates.py

  npm:
    needs: crates
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "npm-*"
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm
        working-directory: crates/pagesift-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npx napi artifacts --output-dir ../../artifacts
          # 主包发布时会先由 prepublishOnly 发平台包；主包已在就说明这一版 npm 已经发完（重跑发布时跳过）
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "@pagesift/node@$version" version 2>/dev/null)" = "$version" ]; then
            echo "@pagesift/node $version is already published."
          else
            npm publish --access public
          fi
          node scripts/publish_wrapper.mjs

  release:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - name: 发布 GitHub 版本页面
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.tag }}" --repo "${{ github.repository }}" --draft=false --latest
