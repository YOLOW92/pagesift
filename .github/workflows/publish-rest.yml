# 补发布：发布流程里 crates.io 遇到频率限制（新账号连发 5 个新包后，每 10 分钟只能发 1 个新包）时，
# 用它把剩下的发完。按依赖顺序逐个发布 Rust 包，已经发布的跳过，被限流就等到 crates.io 给出的时间再试；
# 然后取回那次发布流程里构建好的 npm 包发布到 npm，最后发布 GitHub 版本页面。
name: Publish rest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的版本标签，例如 v0.12.1
        required: true
      run_id:
        description: 那次发布流程的运行编号（npm 包的构建产物从这里取）
        required: true

permissions:
  contents: write
  actions: read

jobs:
  crates:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: crates.io（逐个发布，限流时等待）
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          # 工作区内的包按依赖顺序排好（被依赖的在前），绑定包不发 crates.io
          order=$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          m = json.load(sys.stdin)
          pk = {p["name"]: p for p in m["packages"] if p["name"] not in ("pagesift-py", "pagesift-node")}
          seen, out = set(), []
          def visit(n):
              if n in seen: return
              seen.add(n)
              for d in pk[n]["dependencies"]:
                  if d["name"] in pk and d.get("kind") in (None, "build"): visit(d["name"])
              out.append(n)
          for n in sorted(pk): visit(n)
          print(" ".join(out))')
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="pagesift"))')
          echo "顺序：$order；版本 $version"
          for c in $order; do
            if curl -sf -A "pagesift-release (yolow92@outlook.com)" "https://crates.io/api/v1/crates/$c/$version" > /dev/null; then
              echo "$c $version 已发布，跳过"; continue
            fi
            for attempt in $(seq 1 20); do
              if out=$(cargo publish -p "$c" --locked 2>&1); then echo "$out" | tail -2; break; fi
              echo "$out" | tail -3
              if echo "$out" | grep -q "already exists"; then break; fi
              if echo "$out" | grep -q "429"; then
                after=$(echo "$out" | grep -o 'after [A-Z][a-z]*, [0-9]* [A-Z][a-z]* [0-9]* [0-9:]* GMT' | head -1 | cut -c7-)
                wait=$(( $(date -d "$after" +%s 2>/dev/null || echo $(( $(date +%s) + 600 ))) - $(date +%s) + 15 ))
                [ "$wait" -lt 30 ] && wait=30
                echo "被限流，等 $wait 秒（到 $after）"; sleep "$wait"
              else
                exit 1
              fi
            done
          done

  npm:
    needs: crates
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "npm-*"
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm
        working-directory: crates/pagesift-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npx napi artifacts --dir ../../artifacts
          npm publish --access public

  release:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - name: 发布 GitHub 版本页面
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.tag }}" --repo "${{ github.repository }}" --draft=false --latest
