name: macOS

# 日常检查在本地用 scripts/ci.sh 跑；这里只测本机测不到的 macOS。
on:
  # 只改文档和评测记录的提交不跑（它们不影响 macOS 上的构建和测试）
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**", "benchmarks/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["README.md", "docs/**", "benchmarks/**"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_TEST_THREADS: 2

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/check_release.py
      # 测试里读墙钟要写明为什么慢机器上也成立（这台机器忙时，按墙钟判快慢的测试轮流失败）
      - run: python3 scripts/check_wall_clock.py
      # 浏览器渲染测试（pagesift-cdp 的 render）测的是 Chrome 的行为，和操作系统无关，又最依赖机器快慢：在这台慢机器上
      # 滚动加载类的用例轮流偶发失败。它们由本地 scripts/ci.sh 每次照跑；这里跑其余全部测试。
      - run: cargo test --workspace --locked --exclude pagesift-cdp
      - run: cargo test -p pagesift-cdp --locked --lib --test protocol --test browser --test bench
      # Cargo.toml 声明的最低 Rust 版本真能编译（本地 scripts/ci.sh 同一步）
      - name: MSRV
        run: |
          msrv=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --workspace --locked
