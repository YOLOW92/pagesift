name: Release

# 推 v* 标签时触发：各平台的命令行二进制、Docker 镜像（GHCR）、Python wheel、npm 包、crates.io。
# 发布由维护者手动打标签触发。需要的仓库 secret：CARGO_REGISTRY_TOKEN、NPM_TOKEN；
# PyPI 用 Trusted Publishing（在 PyPI 上把本仓库的 release.yml 配成可信发布者），不需要 token。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything but publish nothing
        type: boolean
        default: true
      recovery_run_id:
        description: Optional original run whose successful artifacts should be reused
        type: string
        default: ''
      recovery_tag:
        description: Required matching tag when recovering artifacts (for example v2.0.0)
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == false }}

permissions:
  contents: read

jobs:
  identity:
    if: github.event_name != 'workflow_dispatch' || inputs.recovery_run_id == ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        name: Check version and tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/check_release.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check_release.py
            if [[ "$PUBLISH" == true ]]; then
              echo "Publishing requires selecting the matching v<version> tag" >&2
              exit 1
            fi
          fi
          echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')" >> "$GITHUB_OUTPUT"

  binaries:
    needs: identity
    name: binary ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p pagesift --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=pagesift-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/pagesift LICENSE COMMERCIAL.md README.md pagesift.example.toml "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: pagesift-*.tar.gz*

  docker:
    needs: identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.identity.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false   # 不上传构建记录，免得发布步骤下载产物时出错
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max

  wheels:
    needs: identity
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/pagesift-py
          args: --release --locked --out dist
          manylinux: "2_28"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native Python wheel
        run: |
          python -m pip install pytest crates/pagesift-py/dist/*.whl
          python -c 'import pagesift; assert pagesift.__version__ == "${{ needs.identity.outputs.version }}"'
          python -m pytest crates/pagesift-py/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/pagesift-py/dist/*.whl

  sdist:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/pagesift-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: crates/pagesift-py/dist/*.tar.gz

  npm:
    needs: identity
    name: npm ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    defaults:
      run:
        working-directory: crates/pagesift-node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx napi build --platform --release --target ${{ matrix.target }} && node scripts/postbuild.mjs
      - name: Verify native Node binding
        run: |
          node -e "if (require('./index.js').version !== require('./package.json').version) process.exit(1)"
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: crates/pagesift-node/*.node

  publish:
    needs: [identity, binaries, docker, wheels, sdist, npm]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 300
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # 只要程序、wheel 和 npm 包；Docker 的构建记录不是普通压缩包，一起下载会失败
          pattern: "{bin,wheels,npm}-*"
      - name: Release notes
        run: python3 scripts/release_notes.py > release-notes.md
      # 先上传草稿；所有渠道成功后才公开为 latest。
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/bin-*/*
          body_path: release-notes.md
      - name: Collect Python packages
        run: mkdir -p dist && cp artifacts/wheels-*/* dist/
      - name: PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # 重跑发布时已经上传过的版本跳过，不挡住后面的步骤
      - uses: dtolnay/rust-toolchain@stable
      - name: crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/publish_crates.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm
        working-directory: crates/pagesift-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npx napi artifacts --output-dir ../../artifacts
          npm publish --access public
      - name: Publish GitHub release after all distributions succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  recovery-intel:
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_run_id != ''
    runs-on: macos-15-intel
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery_tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source identity before reusing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.recovery_run_id }}
          RELEASE_TAG: ${{ inputs.recovery_tag }}
        run: |
          python3 scripts/check_release.py --tag "$RELEASE_TAG"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" --jq .head_sha)" = "$(git rev-parse HEAD)"
      - name: Build and test Intel Node binding with isolated test files
        working-directory: crates/pagesift-node
        run: |
          npm ci
          npx napi build --platform --release --target x86_64-apple-darwin
          node scripts/postbuild.mjs
          node -e "if (require('./index.js').version !== require('./package.json').version) process.exit(1)"
          node --test --test-concurrency=1
      - uses: actions/upload-artifact@v4
        with:
          name: npm-x86_64-apple-darwin
          path: crates/pagesift-node/*.node

  recovery-publish:
    needs: recovery-intel
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 300
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery_tag }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "{bin,wheels,npm}-*"
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: npm-x86_64-apple-darwin
          path: artifacts/npm-x86_64-apple-darwin
      - name: Check complete artifact set
        run: |
          python3 - <<'PYARTIFACTS'
          from pathlib import Path
          expected = {f'bin-{t}' for t in ('x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu', 'aarch64-apple-darwin', 'x86_64-apple-darwin')}
          expected |= {f'npm-{t}' for t in ('x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu', 'aarch64-apple-darwin', 'x86_64-apple-darwin')}
          expected |= {f'wheels-{o}' for o in ('ubuntu-latest', 'ubuntu-24.04-arm', 'macos-latest', 'macos-15-intel', 'sdist')}
          for name in sorted(expected):
              assert any((Path('artifacts')/name).glob('*')), name
          print('All 13 tested artifact groups present')
          PYARTIFACTS
          python3 scripts/release_notes.py > release-notes.md
      - name: GitHub release draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.recovery_tag }}
          draft: true
          files: artifacts/bin-*/*
          body_path: release-notes.md
      - name: Collect Python packages
        run: mkdir -p dist && cp artifacts/wheels-*/* dist/
      - name: PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - uses: dtolnay/rust-toolchain@stable
      - name: crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/publish_crates.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm
        working-directory: crates/pagesift-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npx napi artifacts --output-dir ../../artifacts
          npm publish --access public
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.recovery_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
