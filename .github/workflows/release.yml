name: Release

# 推 v* 标签时触发：各平台的命令行二进制、Docker 镜像（GHCR）、Python wheel、npm 包、crates.io。
# 发布由维护者手动打标签触发。
# 用不到编译产物的渠道不等编译：Docker 镜像自己从源码构建，crates.io 由 cargo publish 自己编译校验，
# 两者和各平台编译同时开始；GitHub Release、PyPI、npm 要用编译产物，等全部编译完成后再发。
# 三个注册表都用 Trusted Publishing（OIDC），仓库里没有长期令牌：
#   crates.io：rust-lang/crates-io-auth-action 换 30 分钟临时令牌（publish_crates.py 会在过期前自己续换）；
#   npm：npm CLI 自动用 OIDC 登录，并自动带 provenance；
#   PyPI：pypa/gh-action-pypi-publish 用 OIDC，自动带 PEP 740 证明。
# 三边的可信发布者都登记为：仓库 YOLOW92/pagesift、工作流 release.yml（补发布用 publish-rest.yml）、环境 release。
# GitHub Release 的压缩包和 SHA256SUMS 带构建证明（gh attestation verify 可验）；GHCR 镜像带 provenance 证明。
# 步骤见 docs/releasing.md。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything but publish nothing
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == false }}

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        name: Check version and tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/check_release.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check_release.py
            if [[ "$PUBLISH" == true ]]; then
              echo "Publishing requires selecting the matching v<version> tag" >&2
              exit 1
            fi
          fi
          echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')" >> "$GITHUB_OUTPUT"

  binaries:
    needs: identity
    name: binary ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # 只编译不运行，在 Apple Silicon 上交叉编译：Intel 机器少、慢，常要排队
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p pagesift --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=pagesift-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/pagesift LICENSE COMMERCIAL.md README.md pagesift.example.toml "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: pagesift-*.tar.gz*

  docker:
    # 镜像在 Dockerfile 里从源码编译，不用其他任务的产物，和它们同时进行
    needs: identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # 镜像构建证明用
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.identity.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false   # 不上传构建记录，免得发布步骤下载产物时出错
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image name in lowercase
        if: env.PUBLISH == 'true'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Attest image provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  wheels:
    needs: identity
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/pagesift-py
          args: --release --locked --out dist
          manylinux: "2_28"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native Python wheel
        run: |
          python -m pip install pytest crates/pagesift-py/dist/*.whl
          python -c 'import pagesift; assert pagesift.__version__ == "${{ needs.identity.outputs.version }}"'
          python -m pytest crates/pagesift-py/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/pagesift-py/dist/*.whl

  sdist:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/pagesift-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: crates/pagesift-py/dist/*.tar.gz

  npm:
    needs: identity
    name: npm ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        working-directory: crates/pagesift-node
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify portable CDP boundary on Windows
        if: runner.os == 'Windows'
        run: cargo test -p pagesift-cdp --lib --locked
      - run: npm ci
      - run: npx napi build --platform --release --target ${{ matrix.target }} && node scripts/postbuild.mjs
      - name: Verify native Node binding
        run: |
          node -e "if (require('./index.js').version !== require('./package.json').version) process.exit(1)"
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: crates/pagesift-node/*.node

  npm-musl:
    needs: identity
    name: npm x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test with native musl Node on Alpine
        run: |
          docker run --rm --cpus=4 --memory=6g \
            -v "$GITHUB_WORKSPACE:/work" -w /work/crates/pagesift-node \
            rust:1.99-alpine sh -euxc '
              apk add --no-cache nodejs npm build-base
              npm ci
              npx napi build --platform --release --target x86_64-unknown-linux-musl
              node scripts/postbuild.mjs
              node -e "if (require(\"./index.js\").version !== require(\"./package.json\").version) process.exit(1)"
              npm test
            '
      - uses: actions/upload-artifact@v4
        with:
          name: npm-x86_64-unknown-linux-musl
          path: crates/pagesift-node/*.node

  crates:
    # cargo publish 自己打包、编译校验每个 crate，不用其他任务的产物；
    # 依次发 15 个 crate 要等索引，单独先跑，不再排在所有编译之后
    needs: identity
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write       # 向 crates.io 换临时令牌（Trusted Publishing）
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: crates.io 临时令牌
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/publish_crates.py

  github-release:
    # 只负责 GitHub 草稿版本和构建证明；写权限只给这个任务
    needs: [identity, binaries, docker, wheels, sdist, npm, npm-musl, crates]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write       # 构建证明用
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # 只要程序压缩包；Docker 的构建记录不是普通压缩包，一起下载会失败
          pattern: "bin-*"
      - name: Release notes
        run: python3 scripts/release_notes.py > release-notes.md
      - name: Collect release files and SHA256SUMS
        run: |
          mkdir release-assets
          cp artifacts/bin-*/* release-assets/
          cd release-assets
          sha256sum pagesift-*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      # 每个压缩包、.sha256 文件和 SHA256SUMS 清单本身都有构建证明：
      #   gh attestation verify <文件> --repo YOLOW92/pagesift
      - name: Attest release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      # 先上传草稿；所有渠道成功后才公开为 latest。
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-assets/*
          body_path: release-notes.md

  pypi:
    needs: [identity, github-release, wheels, sdist]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "wheels-*"
      - name: Collect Python packages
        run: mkdir -p dist && cp artifacts/wheels-*/* dist/
      - name: PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # 重跑发布时已经上传过的版本跳过，不挡住后面的步骤

  npm-publish:
    needs: [identity, pypi, npm, npm-musl]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write       # npm Trusted Publishing 和 provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "npm-*"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm
        working-directory: crates/pagesift-node
        env:
          NPM_CONFIG_PROVENANCE: "true"   # 子进程（napi prepublish、publish_wrapper）也继承，每个包都带证明
        run: |
          # Trusted Publishing 要 npm CLI 11.5.1 以上，Node 22 自带的 npm 10 不够
          npm install -g npm@^11.5.1
          npm --version
          npm ci
          npx napi artifacts --output-dir ../../artifacts
          # 主包发布时会先由 prepublishOnly 发平台包；主包已在就说明这一版 npm 已经发完（重跑发布时跳过）
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "@pagesift/node@$version" version 2>/dev/null)" = "$version" ]; then
            echo "@pagesift/node $version is already published."
          else
            npm publish --access public --provenance
          fi
          node scripts/publish_wrapper.mjs

  publish:
    # 所有渠道都成功后才把草稿版本公开
    needs: [identity, github-release, docker, crates, pypi, npm-publish]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release after all distributions succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
