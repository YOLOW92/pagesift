name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issues (SSRF bypasses, credential leaks) go through private reporting instead — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A URL (public), the request body or command, and your config (remove secrets).
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pagesift version
      description: Output of `pagesift --version`
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, how you run it (binary, Docker, Python, Node), and `pagesift doctor` output.
