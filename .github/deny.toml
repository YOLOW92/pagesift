# 依赖许可证白名单：只允许宽松许可证（见 PRD 第 9 节）。
[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
]
# pagesift 自己的 crate 用 AGPL-3.0（另有商业许可证，见 docs/COMMERCIAL.md）。第三方依赖仍然只允许上面的宽松许可证：
# 混进 copyleft 依赖就没法给企业发商业许可证了。
exceptions = [
    { name = "pagesift", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-api", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-cdp", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-content", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-diff", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-extract", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-fuzz", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-html", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-llm", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-mcp", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-net", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-office", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-node", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-pdf", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-policy", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-py", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-search", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-store", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-sys", allow = ["AGPL-3.0-only"] },
    { name = "pagesift-testkit", allow = ["AGPL-3.0-only"] },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
version = 2
