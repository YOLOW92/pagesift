# pagesift-html 和 html5ever/scraper 的对拍工具，不属于 pagesift workspace，也不随 pagesift 发布。
# scraper 依赖的 selectors、cssparser 是 MPL-2.0，所以放在 workspace 外面。
#   cargo run --release --bin tree -- <inputs dir> [show]                 解析树对拍和解析速度
#   cargo run --release --bin css -- parity <inputs dir> [show] [templates] CSS 选择器对拍
[package]
name = "pagesift-html-parity"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
pagesift-html = { path = "../../../crates/pagesift-html" }
scraper = "0.27.0"
