[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.91.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/YOLOW92/pagesift"
rust-version = "1.89"

# 发布版：整个程序一起优化（跨 crate 内联），不切块编译。cachegrind 估算周期（scripts/perf_counts.sh）：
# HTML 正文抽取 −13.6%、PDF −4.7%、CSV +0.9%（thin LTO 分别 −10.9%、−4.9%、+1.0%）。只影响 release
# 构建的时间；panic 仍然 unwind（PDF、Office、MCP 用 catch_unwind 兜住解析器的意外 panic）。
[profile.release]
lto = "fat"
codegen-units = 1

# 日常测性能、试改动用的快速发布档（`cargo build --profile release-fast`）：thin LTO、多块并行编译，
# 比 release 快几倍，速度接近（HTML −10.9%、PDF −4.9%，见上）。发布的二进制不用它。
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

# 日常改代码后跑测试用（`cargo test --profile quick`）：自己的代码增量编译、轻度优化、不做 LTO，
# 改一个文件只重编改动的部分；第三方依赖按 opt-level 2 编一次后缓存（解析、压缩这类热点不至于太慢）。
# 带 debug_assertions，计时类测试走放宽的分支。测速和发布不用它。
[profile.quick]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.quick.package."*"]
opt-level = 2
