# 1.0 scorecard
#
# One row = one workload + one metric.  The PageSift value is read from
# $RUN/metrics.tsv by the key in `psift`; the competitor value is the frozen
# number from the date in `rival_source` and is NOT re-run in this round.
#
# Classification (see summarize.py):
#   speed   ratio = psift/rival (up) or rival/psift (down)
#           far >= 1.75x, ahead >= 1.10x
#   quality delta = psift-rival (up) or rival-psift (down)
#           far >= +0.10, ahead >= +0.01
#   memory is shown as a column and never enters the two headline tables.
#
# `headline = false` keeps a row in the detailed report only.
# `gap = true` marks the rows used for the one-line "largest gaps" sentence.

[meta]
date = "2026-11-04"
machine = "Intel Core i7-10700 (8C/16T), 15 GB RAM, NVMe, Linux 7.0"
pagesift = "1.0"
rival_note = "competitor numbers are the recorded 2026-10-21/22/27/28 runs; they were not re-run for 1.0"
network = "live-web stages (A3, wild) ran over a phone hotspot on 4G; the recorded competitor runs used a different network"

