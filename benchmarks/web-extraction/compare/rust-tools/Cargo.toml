# 对照评测用的独立项目，不属于 pagesift workspace，也不随 pagesift 发布。
# crw-extract 是 AGPL-3.0，只在这里用于评测。
[package]
name = "pagesift-compare-rust"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
crw-core = "0.39.0"
crw-extract = "0.39.0"
pagesift-content = { path = "../../../crates/pagesift-content" }
url = "2.5.8"
dom_smoothie = "0.18.2"
htmd = "0.5.6"
html-to-markdown-rs = "3.18.6"
rs-trafilatura = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
