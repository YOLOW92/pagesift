[package]
description = "A single-binary, Firecrawl-compatible web scraping engine that turns pages into clean Markdown."
name = "pagesift"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
encoding_rs = "0.8.42"
pagesift-cdp = { version = "0.0.1", path = "../pagesift-cdp" }
pagesift-content = { version = "0.0.1", path = "../pagesift-content" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
