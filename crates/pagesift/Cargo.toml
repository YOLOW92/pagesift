[package]
description = "A single-binary, Firecrawl-compatible web scraping engine that turns pages into clean Markdown."
name = "pagesift"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pagesift-content = { version = "0.0.1", path = "../pagesift-content" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
