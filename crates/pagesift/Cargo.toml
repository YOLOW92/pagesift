[package]
description = "A single-binary, Firecrawl-compatible web scraping engine that turns pages into clean Markdown."
name = "pagesift"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
encoding_rs = "0.8.42"
flate2 = "1.1.10"
futures-util = "0.3.34"
httpdate = "1.0.3"
pagesift-api = { version = "0.0.1", path = "../pagesift-api" }
pagesift-cdp = { version = "0.0.1", path = "../pagesift-cdp" }
pagesift-content = { version = "0.0.1", path = "../pagesift-content" }
pagesift-net = { version = "0.0.1", path = "../pagesift-net" }
pagesift-pdf = { version = "0.0.1", path = "../pagesift-pdf" }
pagesift-policy = { version = "0.0.1", path = "../pagesift-policy" }
quick-xml = "0.42.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
serde_json = "1.0.154"
