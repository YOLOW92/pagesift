[package]
description = "A single-binary, Firecrawl-compatible web scraping engine that turns pages into clean Markdown."
name = "pagesift"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pagesift-sys = { version = "0.50.0", path = "../pagesift-sys" }
anyhow = "1.0.104"
blake3 = "1.8.7"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
encoding_rs = "0.8.42"
flate2 = "1.1.10"
futures-util = "0.3.34"
fs2 = "0.4.3"
httpdate = "1.0.3"
pagesift-api = { version = "0.50.0", path = "../pagesift-api" }
pagesift-cdp = { version = "0.50.0", path = "../pagesift-cdp" }
pagesift-content = { version = "0.50.0", path = "../pagesift-content" }
pagesift-diff = { version = "0.50.0", path = "../pagesift-diff" }
pagesift-extract = { version = "0.50.0", path = "../pagesift-extract" }
pagesift-html = { version = "0.50.0", path = "../pagesift-html" }
pagesift-llm = { version = "0.50.0", path = "../pagesift-llm" }
pagesift-mcp = { version = "0.50.0", path = "../pagesift-mcp" }
pagesift-net = { version = "0.50.0", path = "../pagesift-net" }
pagesift-pdf = { version = "0.50.0", path = "../pagesift-pdf" }
pagesift-policy = { version = "0.50.0", path = "../pagesift-policy" }
pagesift-search = { version = "0.50.0", path = "../pagesift-search" }
pagesift-store = { version = "0.50.0", path = "../pagesift-store" }
quick-xml = "0.42.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
pagesift-store = { path = "../pagesift-store" }
serde_json = "1.0.154"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
