[package]
description = "Pure-Rust OCR for scanned PDF pages: PP-OCRv6 text detection and recognition on CPU."
name = "pagesift-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pagesift-infer = { version = "0.91.1", path = "../pagesift-infer" }
# 适配 PDF 的扫描页接口（pagesift-pdf 本身不依赖模型）
pagesift-pdf = { version = "0.91.1", path = "../pagesift-pdf" }
sha2 = "0.11.1"
serde_json = "1.0.154"
