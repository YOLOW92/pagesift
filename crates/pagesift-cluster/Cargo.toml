[package]
description = "pagesift multi-server coordination: frame protocol, leases and fencing, HRW site affinity, log-shipping warm standby, stats aggregation."
name = "pagesift-cluster"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = { version = "1.8.7", features = ["pure"] }
bytes = "1.12.1"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "server", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
pagesift-stat = { version = "1.1.1", path = "../pagesift-stat" }
pagesift-store = { version = "1.1.1", path = "../pagesift-store" }
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "time", "io-util", "net"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
ring = "0.17.14"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
