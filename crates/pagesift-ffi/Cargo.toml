[package]
name = "pagesift-ffi"
description = "C ABI for pagesift (libpagesift), used by the Go, Java, C#, Ruby and PHP bindings."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# 以原生库压缩包发布，不发布到 crates.io。
publish = false

[lib]
name = "pagesift"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# 输出库名也是 pagesift，依赖改个名字，免得两者在 crate 名上撞车。
pagesift-core = { package = "pagesift", version = "1.2.1", path = "../pagesift" }
pagesift-cdp = { version = "1.2.1", path = "../pagesift-cdp" }
pagesift-content = { version = "1.2.1", path = "../pagesift-content" }
pagesift-sink = { version = "1.2.1", path = "../pagesift-sink" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
url = "2.5.8"
