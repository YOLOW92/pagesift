[package]
name = "pagesift-node"
description = "Node.js bindings for pagesift (npm package `pagesift`)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# 通过 npm 发布，不发布到 crates.io。
publish = false

[lib]
name = "pagesift_node"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.14.2", features = ["napi6", "tokio_rt", "serde-json"] }
napi-derive = "3.6.12"
pagesift = { version = "0.80.10", path = "../pagesift" }
pagesift-content = { version = "0.80.10", path = "../pagesift-content" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["sync", "rt"] }
url = "2.5.8"

[build-dependencies]
napi-build = "2.6.0"
