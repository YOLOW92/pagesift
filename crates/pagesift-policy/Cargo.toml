[package]
description = "Polite crawling for pagesift: RFC 9309 robots.txt, per-host rate limits, adaptive backoff and unified error codes."
name = "pagesift-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
httpdate = "1.0.3"
pagesift-net = { path = "../pagesift-net", version = "0.80.1" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["param", "thread"] }

[dev-dependencies]
proptest = { version = "1.7.0", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync", "test-util"] }
