[package]
description = "Block-level Markdown snapshot diff that separates noise changes (price, date, count) from substantive ones."
name = "pagesift-diff"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
blake3 = "1.8.7"
unicode-normalization = "0.1"

[dev-dependencies]
proptest = "1"
serde_json = "1"
