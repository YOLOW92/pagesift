[package]
description = "Self-contained MCP server (JSON-RPC 2.0, stdio and Streamable HTTP) for pagesift's scraping tools."
name = "pagesift-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
reqwest = { version = "0.12.28", default-features = false }
tokio = { version = "1.54.1", features = ["process"] }
