[package]
description = "HTML to clean Markdown: main-content extraction, Markdown generation and metadata, built for LLM pipelines."
name = "pagesift-content"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aho-corasick = "1.1.5"
memchr = "2.8.3"
pagesift-html = { version = "0.81.3", path = "../pagesift-html" }
regex = "1.13.1"
serde_json = "1.0.154"
blake3 = "1.8.7"
unicode-normalization = "0.1.26"
url = "2.5.8"

[dev-dependencies]
pagesift-testkit = { path = "../pagesift-testkit" }
# 性能示例和发布的可执行程序用同一个全局分配器
pagesift-sys = { path = "../pagesift-sys" }
