[package]
description = "Polite HTTP fetcher for pagesift: SSRF-guarded DNS, manual redirects, size caps, charset detection, scoped credentials."
name = "pagesift-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1.8.7"
brotli-decompressor = "5.0.3"
bytes = "1.12.1"
chardetng = "0.1.17"
flate2 = "1.1.10"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
quick-xml = "0.42.0"
rustls-native-certs = "0.8.5"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
zstd = "0.13.3"
encoding_rs = "0.8.35"
httpdate = "1.0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "http2", "gzip", "brotli", "zstd", "deflate", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0"
tokio = { version = "1", features = ["net", "time", "rt", "sync", "macros"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
