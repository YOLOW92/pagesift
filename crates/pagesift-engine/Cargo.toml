[package]
description = "pagesift engine: single-page scrape pipeline (HTTP, rendering, render decisions, PDF/Office) and the crawl loop."
name = "pagesift-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pagesift-sys = { version = "1.2.1", path = "../pagesift-sys" }
anyhow = "1.0.104"
blake3 = { version = "1.8.7", features = ["pure"] }
axum = "0.8.9"
csv = "1.4.0"
encoding_rs = "0.8.42"
flate2 = "1.1.10"
futures-util = "0.3.34"
fs2 = "0.4.3"
httpdate = "1.0.3"
pagesift-api = { version = "1.2.1", path = "../pagesift-api" }
pagesift-cdp = { version = "1.2.1", path = "../pagesift-cdp" }
pagesift-cluster = { version = "1.2.1", path = "../pagesift-cluster" }
pagesift-content = { version = "1.2.1", path = "../pagesift-content" }
pagesift-flow = { version = "1.2.1", path = "../pagesift-flow" }
pagesift-frontier = { version = "1.2.1", path = "../pagesift-frontier" }
pagesift-plan = { version = "1.2.1", path = "../pagesift-plan" }
pagesift-sink = { version = "1.2.1", path = "../pagesift-sink" }
pagesift-stat = { version = "1.2.1", path = "../pagesift-stat" }
pagesift-diff = { version = "1.2.1", path = "../pagesift-diff" }
pagesift-extract = { version = "1.2.1", path = "../pagesift-extract" }
pagesift-hooks = { version = "1.2.1", path = "../pagesift-hooks" }
pagesift-html = { version = "1.2.1", path = "../pagesift-html" }
pagesift-itna = { version = "1.2.1", path = "../pagesift-itna" }
pagesift-media = { version = "1.2.1", path = "../pagesift-media" }
pagesift-llm = { version = "1.2.1", path = "../pagesift-llm" }
pagesift-mcp = { version = "1.2.1", path = "../pagesift-mcp" }
pagesift-net = { version = "1.2.1", path = "../pagesift-net" }
pagesift-office = { version = "1.2.1", path = "../pagesift-office" }
pagesift-pdf = { version = "1.2.1", path = "../pagesift-pdf" }
pagesift-policy = { version = "1.2.1", path = "../pagesift-policy" }
pagesift-search = { version = "1.2.1", path = "../pagesift-search" }
pagesift-store = { version = "1.2.1", path = "../pagesift-store" }
quick-xml = "0.42.0"
regex = "1.13.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util"] }
toml = "1.1.8"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
pagesift-store = { path = "../pagesift-store" }
serde_json = "1.0.154"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
