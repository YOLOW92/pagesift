[package]
name = "pagesift-syntax"
description = "Code outline extraction and pure-Rust tree-sitter runtime for PageSift (re-exports yolowsyntax)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include = ["src/**", "tests/**", "THIRD-PARTY.md", "Cargo.toml"]

[features]
# 转换器、corpus 验证和命令行工具；默认不编
tools = ["yolowsyntax/tools"]

[dependencies]
yolowsyntax = "0.1.2"

[[test]]
name = "grammars"
required-features = ["tools"]

[[test]]
name = "json"
required-features = ["tools"]
