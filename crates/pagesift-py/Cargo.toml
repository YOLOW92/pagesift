[package]
name = "pagesift-py"
description = "Python bindings for pagesift (PyPI package `pagesift`)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# 通过 maturin 发布到 PyPI，不发布到 crates.io。
publish = false

[lib]
name = "_pagesift"
crate-type = ["cdylib"]

[dependencies]
pagesift = { version = "0.12.0", path = "../pagesift" }
pagesift-cdp = { version = "0.12.0", path = "../pagesift-cdp" }
pagesift-content = { version = "0.12.0", path = "../pagesift-content" }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2.5.8"
