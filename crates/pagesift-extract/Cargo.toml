[package]
description = "Schema-based structured extraction (CSS/XPath), regex entity extraction, Markdown chunking and BM25 filtering for pagesift."
name = "pagesift-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = { version = "1.8.7", features = ["pure"] }
memchr = "2.8.3"
pagesift-diff = { version = "1.6.1", path = "../pagesift-diff" }
pagesift-graph = { version = "1.6.1", path = "../pagesift-graph" }
pagesift-html = { version = "1.6.1", path = "../pagesift-html" }
pagesift-stat = { version = "1.6.1", path = "../pagesift-stat" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
xpath-eval = "0.2.2"
url = "2.5.8"
