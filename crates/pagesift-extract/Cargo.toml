[package]
description = "Schema-based structured extraction (CSS/XPath), regex entity extraction, Markdown chunking and BM25 filtering for pagesift."
name = "pagesift-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
memchr = "2.8.3"
pagesift-html = { version = "0.40.0", path = "../pagesift-html" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
xpath-eval = "0.2.2"
url = "2.5.8"
