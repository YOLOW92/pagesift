[package]
description = "Office documents and archives to Markdown for pagesift, powered by yolowdoc."
name = "pagesift-office"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["syntax", "zstd"]
# 代码文件大纲提取（函数、类、导入）
syntax = ["yolowdoc/syntax"]
# .zst / .tar.zst 压缩包解压
zstd = ["yolowdoc/zstd"]

[dependencies]
yolowdoc = { version = "0.1.1", default-features = false }

[dev-dependencies]
pagesift-compress = { path = "../pagesift-compress" }
