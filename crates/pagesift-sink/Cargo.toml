[package]
description = "pagesift outputs: envelopes, metadata keys, binary cache format."
name = "pagesift-sink"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pagesift-api = { version = "1.1.2", path = "../pagesift-api" }
pagesift-content = { version = "1.1.2", path = "../pagesift-content" }
pagesift-store = { version = "1.1.2", path = "../pagesift-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
