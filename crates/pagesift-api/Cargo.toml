[package]
name = "pagesift-api"
description = "Firecrawl v2 compatible HTTP API for pagesift."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
http-body = "1.1.0"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "server-graceful", "service", "tokio"] }
pagesift-net = { version = "0.80.3", path = "../pagesift-net" }
pagesift-office = { version = "0.80.3", path = "../pagesift-office" }
pagesift-store = { version = "0.80.3", path = "../pagesift-store" }
regex = "1.13.1"
ring = "0.17.14"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.54.0", features = ["io-util"] }
