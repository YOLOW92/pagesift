[package]
description = "Embedded append-only log store for pagesift: scrape cache, HTML snapshots and crawl task state."
name = "pagesift-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["tokio"]
# 提供 `Store::blocking`，把调用放进 tokio 的 spawn_blocking。
tokio = ["dep:tokio"]

[dependencies]
crc32fast = "1.4"
blake3 = "1.8.7"
flate2 = "1.1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt"], optional = true }
zstd = { version = "0.14.3", default-features = false }

[dev-dependencies]
pagesift-testkit = { path = "../pagesift-testkit" }
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
