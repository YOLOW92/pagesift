[package]
description = "Embedded append-only log store for pagesift: scrape cache, HTML snapshots and crawl task state."
name = "pagesift-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["tokio"]
# 提供 `Store::blocking`，把调用放进 tokio 的 spawn_blocking。
tokio = ["dep:tokio"]

[dependencies]
pagesift-graph = { version = "1.4.1", path = "../pagesift-graph" }
pagesift-stat = { version = "1.4.1", path = "../pagesift-stat" }
crc32fast = "1.4"
blake3 = { version = "1.8.7", features = ["pure"] }
flate2 = "1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt"], optional = true }
pagesift-compress = { version = "1.4.1", path = "../pagesift-compress" }

[dev-dependencies]
pagesift-testkit = { path = "../pagesift-testkit" }
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
