# pagesift 配置示例。使用：pagesift --config pagesift.toml serve，或设置 PAGESIFT_CONFIG。
# 优先级：命令行参数 > 环境变量 > 配置文件 > 默认值。
# 密钥可以直接写值，也可以写成 { env = "VAR" } 从环境变量读取。

[server]
host = "127.0.0.1"
port = 3002
# api_keys = ["change-me", { env = "PAGESIFT_KEY" }]
# public_url = "https://pagesift.example.com"
# 爬取和批量抓取任务存进数据目录（和缓存共用 [cache] dir），重启后结束的任务照样能查，
# 进行中的从断点继续
persist_jobs = true

# 每个 API key 的限额：每分钟请求数（只算发起工作的 POST）、同时进行的任务数、每天（UTC）的页面数。
# 超限返回 429，错误体 {success:false, code, error}，code 是 RATE_LIMIT_EXCEEDED、
# CONCURRENCY_LIMIT_EXCEEDED 或 QUOTA_EXCEEDED。不写的项不限。
# [server.limits]            # 没单独配置的 key（不鉴权时所有调用方合用）
# requests_per_minute = 600
# max_concurrent_jobs = 10
# pages_per_day = 100000
# [[server.keys]]            # 单独设限额的 key，也是有效的 key
# key = { env = "TEAM_A_KEY" }
# name = "team-a"            # 日志、监控、配额记录里用的名字；不写时用 key 的指纹
# requests_per_minute = 60
# max_concurrent_jobs = 2
# pages_per_day = 5000

# crawl / batch 请求里的 webhook：失败按指数退避重试，目标地址过 SSRF 校验
# [server.webhook]
# allow_private_network = false
# 单独放行的主机名（完全匹配），解析到内网地址也可以抓，例如内部服务
# allow_hosts = ["docs.internal"]

# 命名出口：请求里用 "egress": "tunnel-a" 指定，只用于 HTTP 抓取（指定后不升级到浏览器）。
# 只支持 http、https、socks5（socks5h 会让代理去解析域名，绕过内网地址校验）。
# [[egress]]
# name = "tunnel-a"
# proxy = "socks5://172.17.0.1:1081"
# max_attempts = 5
# timeout_secs = 10
# secret = { env = "PAGESIFT_WEBHOOK_SECRET" }   # 设了就带 X-Firecrawl-Signature: sha256=<HMAC-SHA256>

# 结构化日志：format = "json" 输出 JSON（环境变量 PAGESIFT_LOG_FORMAT 优先），级别用 PAGESIFT_LOG
# [log]
# format = "text"

[fetch]
# 自定义 UA 必须表明是机器人；冒充浏览器的 UA 会被拒绝。
# user_agent = "acme-bot/1.0 (+https://acme.example/bot)"
timeout_secs = 60
max_body_mb = 15
# 企业网络出口代理（不是代理池）
# proxy = "http://proxy.internal:3128"
allow_private_network = false

[policy]
# 同一主机两次请求之间的最小间隔；robots.txt 的 Crawl-delay 优先
interval_ms = 1000
per_host_concurrency = 2
global_concurrency = 64
# 允许 crawl 和 map 请求忽略 robots.txt（默认不允许）
allow_crawl_ignore_robots = false

[browser]
# path = "/usr/bin/chromium"
# remote = "ws://127.0.0.1:9222/devtools/browser/..."
# 不写或写 0 时按可用内存和 CPU 核数自动决定（每 4 个核最多一个浏览器）
# max_browsers = 4
max_tabs_per_browser = 4
# 系统可用内存低于这个值（MB）时不再开新标签页，等已有页面结束；0 表示不检查
min_available_memory_mb = 1024

[cache]
enabled = true
# dir = "/var/lib/pagesift"
# max_mb = 2048

# 和站点谈好的授权凭证，只发给对应主机；重定向到其他主机时自动去掉。
# [[credentials]]
# host = "partner.example.com"
# headers = { Authorization = { env = "PARTNER_TOKEN" } }
# cookies = { session = "..." }

# summary、json 格式和 /v2/extract 用的 OpenAI 兼容服务
# [llm]
# base_url = "http://localhost:11434/v1"
# model = "qwen3"
# api_key = { env = "OPENAI_API_KEY" }

# /v2/search 的搜索后端：searxng、brave、bing、google、tavily
# [search]
# backend = "searxng"
# endpoint = "http://localhost:8080"
