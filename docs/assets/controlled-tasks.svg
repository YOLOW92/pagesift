<title id="title">Controlled navigation, relocation and media comparisons</title><desc id="desc">Navigation 13/13, Katana 10/13, Crawlee Cheerio 2/13. Fuzzy 64/64 versus Scrapling 56/64. Media both 20/20. Synthetic bounded tasks only.</desc>
