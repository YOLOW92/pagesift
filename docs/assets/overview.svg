<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="355" viewBox="0 0 1000 355" role="img" aria-labelledby="title desc">
<title id="title">Pagesift 0.20.0 architecture overview</title><desc id="desc">Acquire pages, understand content and deliver durable data through Rust modules. New cores are exposed through Rust and CLI.</desc>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect x="0" y="0" width="1000" height="355" rx="16" fill="#101b2a"/><text x="38" y="52" font-size="32" fill="#ffffff" font-weight="700">pagesift 0.20.0</text><text x="38" y="82" font-size="18" fill="#a6b8ca" font-weight="400">One Rust engine. From page to durable, usable data.</text><rect x="38" y="113" width="284" height="150" rx="6" fill="#1d2e43"/><text x="56" y="145" font-size="15" fill="#56d9c0" font-weight="700">ACQUIRE</text><text x="56" y="179" font-size="15" fill="#dce5ee" font-weight="400">HTTP + bounded discovery</text><text x="56" y="206" font-size="15" fill="#dce5ee" font-weight="400">Render when needed</text><text x="56" y="233" font-size="15" fill="#dce5ee" font-weight="400">Origin-isolated sessions</text><rect x="358" y="113" width="284" height="150" rx="6" fill="#1d2e43"/><text x="376" y="145" font-size="15" fill="#56d9c0" font-weight="700">UNDERSTAND</text><text x="376" y="179" font-size="15" fill="#dce5ee" font-weight="400">Main content + Markdown</text><text x="376" y="206" font-size="15" fill="#dce5ee" font-weight="400">Identity + fuzzy anchors</text><text x="376" y="233" font-size="15" fill="#dce5ee" font-weight="400">Forms + media adapters</text><rect x="678" y="113" width="284" height="150" rx="6" fill="#1d2e43"/><text x="696" y="145" font-size="15" fill="#56d9c0" font-weight="700">DELIVER</text><text x="696" y="179" font-size="15" fill="#dce5ee" font-weight="400">Incremental checkpoints</text><text x="696" y="206" font-size="15" fill="#dce5ee" font-weight="400">Verified resumable archives</text><text x="696" y="233" font-size="15" fill="#dce5ee" font-weight="400">Finite HLS / DASH VOD</text><text x="326" y="200" font-size="25" fill="#56d9c0" font-weight="400">→</text><text x="646" y="200" font-size="25" fill="#56d9c0" font-weight="400">→</text><text x="38" y="300" font-size="16" fill="#dce5ee" font-weight="400">CLI  /  Firecrawl-compatible HTTP API  /  MCP  /  native Python + Node</text><text x="38" y="330" font-size="14" fill="#a6b8ca" font-weight="400">New collection and archive cores: Rust APIs + CLI. Binding surfaces remain scoped.</text></g></svg>
