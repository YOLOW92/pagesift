<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">Forty category capability inventory</title><desc id="desc">17 implemented or bounded categories,17 partial,2 unverified,2 product boundaries,2 excluded by user. No full functional leadership claim.</desc>
