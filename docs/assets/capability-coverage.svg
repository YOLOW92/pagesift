 x="38" y="393" font-size="15" fill="#f6c577" font-weight="400">7 formerly missing categories now have bounded native Rust cores; 17 remain partial.</text><text x="38" y="422" font-size="14" fill="#a6b8ca" font-weight="400">Browser interaction + autonomous Agent tasks excluded. Anti-bot bypass / rotation not offered.</text></g></svg>
