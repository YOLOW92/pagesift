# pagesift 配置示例。使用：pagesift --config pagesift.toml serve，或设置 PAGESIFT_CONFIG。
# 未指定时自动读取平台默认路径：
#   Linux/macOS: $XDG_CONFIG_HOME/pagesift/pagesift.toml 或 ~/.config/pagesift/pagesift.toml
#   Windows:     %APPDATA%\pagesift\pagesift.toml
# 优先级：命令行参数 > 环境变量 > 配置文件 > 默认值。
# PAGESIFT_CONFIG= （空值）表示不读任何配置文件。
# 密钥可以直接写值，也可以写成 { env = "VAR" } 从环境变量读取。

[server]
host = "127.0.0.1"
port = 3002
# api_keys = ["change-me", { env = "PAGESIFT_KEY" }]
# public_url = "https://pagesift.example.com"
# 爬取和批量抓取任务存进数据目录（和缓存共用 [cache] dir），重启后结束的任务照样能查，
# 进行中的从断点继续
persist_jobs = true

# 每个 API key 的限额：每分钟请求数（只算发起工作的 POST）、同时进行的任务数、每天（UTC）的页面数。
# 超限返回 429，错误体 {success:false, code, error}，code 是 RATE_LIMIT_EXCEEDED、
# CONCURRENCY_LIMIT_EXCEEDED 或 QUOTA_EXCEEDED。不写的项不限。
# [server.limits]            # 没单独配置的 key（不鉴权时所有调用方合用）
# requests_per_minute = 600
# max_concurrent_jobs = 10
# pages_per_day = 100000
# [[server.keys]]            # 单独设限额的 key，也是有效的 key
# key = { env = "TEAM_A_KEY" }
# name = "team-a"            # 日志、监控、配额记录里用的名字；不写时用 key 的指纹
# requests_per_minute = 60
# max_concurrent_jobs = 2
# pages_per_day = 5000

# 服务端时限（秒，必须大于 0）：读请求头、读请求体、/v2/parse 上传的请求体、整个请求到响应头发出。
# 都超时回 408 TIMEOUT（读请求头超时直接断开连接）。整请求时限要大于请求里 scrape 的 timeout。
# [server.timeouts]
# header_read_secs = 30
# body_secs = 30
# upload_body_secs = 120
# request_secs = 360

# crawl / batch 请求里的 webhook：失败按指数退避重试，目标地址过 SSRF 校验
# [server.webhook]
# allow_private_network = false
# 单独放行的主机名（完全匹配），解析到内网地址也可以抓，例如内部服务
# allow_hosts = ["docs.internal"]

# 命名出口：请求里用 "egress": "tunnel-a" 指定，只用于 HTTP 抓取（指定后不升级到浏览器）。
# 只支持 http、https、socks5（socks5h 会让代理去解析域名，绕过内网地址校验）。
# [[egress]]
# name = "tunnel-a"
# proxy = "socks5://172.17.0.1:1081"
# max_attempts = 5
# timeout_secs = 10
# secret = { env = "PAGESIFT_WEBHOOK_SECRET" }   # 设了就带 X-Firecrawl-Signature: sha256=<HMAC-SHA256>

# 结构化日志：format = "json" 输出 JSON（环境变量 PAGESIFT_LOG_FORMAT 优先），级别用 PAGESIFT_LOG
# [log]
# format = "text"

[fetch]
# 自定义 UA 必须表明是机器人；冒充浏览器的 UA 会被拒绝。
# user_agent = "acme-bot/1.0 (+https://acme.example/bot)"
# Browser fingerprint mode, off by default. HTTP fetches then present Chrome's TLS, HTTP/2 and request headers, so
# sites see Chrome and not pagesift. Whether that complies with a site's terms is the operator's responsibility.
# robots.txt (matched against user_agent above) and rate limits still apply. Does not work through a proxy yet.
# browser_fingerprint = "chrome"
timeout_secs = 60
max_body_mb = 15
# 企业网络出口代理（不是代理池）
# proxy = "http://proxy.internal:3128"
# 没写 proxy 时用环境变量里的代理（HTTPS_PROXY、HTTP_PROXY、ALL_PROXY，按 NO_PROXY 绕行）；false 时不用
# env_proxy = true
allow_private_network = false

[policy]
# 同一主机两次请求之间的最小间隔；robots.txt 的 Crawl-delay 优先
interval_ms = 1000
per_host_concurrency = 2
global_concurrency = 64
# 允许 crawl 和 map 请求忽略 robots.txt（默认不允许）
allow_crawl_ignore_robots = false

[browser]
# path = "/usr/bin/chromium"
# remote = "ws://127.0.0.1:9222/devtools/browser/..."
# 主力内核的进程上限（不写时按 CPU 和内存自适应）；回退内核只分到四分之一
# max_browsers = 4
max_tabs_per_browser = 4
# 系统可用内存低于这个值（MB）时不再开新标签页，等已有页面结束；0 表示不检查
min_available_memory_mb = 1024

[cache]
enabled = true
# dir = "/var/lib/pagesift"
# max_mb = 2048

# 和站点谈好的授权凭证，只发给对应主机；重定向到其他主机时自动去掉。
# [[credentials]]
# host = "partner.example.com"
# headers = { Authorization = { env = "PARTNER_TOKEN" } }
# cookies = { session = "..." }

# summary、json 格式、/v2/extract 和 /v2/agent 用的 OpenAI 兼容服务
# [llm]
# base_url = "http://localhost:11434/v1"
# model = "qwen3"
# api_key = { env = "OPENAI_API_KEY" }

# /v2/search 和 /v2/agent 的搜索后端：searxng、brave、bing、google、tavily
# [search]
# backend = "searxng"
# endpoint = "http://localhost:8080"

# 按主机和路径匹配的抓取规则，启动时编译成钩子；写错的键启动时报错。主机也匹配子域名；
# path_glob：`*` 一段路径内任意、`**` 跨段、`?` 一个字符。
# [[rules]]
# match = { host = "example.com", path_glob = "/blog/**" }
# headers = { "Accept-Language" = "en" }
# include_tags = ["article"]
# exclude_tags = [".ads"]
# engine = "http"
# schema = { baseSelector = "li.post", fields = [{ name = "title", selector = "h2", type = "text" }] }
# drop_fields = ["links", "extract.internal_id"]
# rename_fields = { title = "headline" }
# priority = 0

# 扫描 PDF 页的 OCR，默认关。打开后，第一张扫描图来时才从上游的锁定版本下载模型并校验 SHA-256
# （权重不随 pagesift 分发）；离线环境用 `pagesift models fetch` 提前下好。
# [ocr]
# enabled = true
# quality = "auto"       # auto：有 GPU 且显存放得下时用中模型，否则小模型；fast：小模型；accurate：中模型
# formulas = false       # 也把行间公式认成 LaTeX（多下载约 860 MB，每个公式要几秒）
# models_dir = "/data/pagesift/models"   # 缺省 $XDG_CACHE_HOME/pagesift/models

# OCR 用哪块显卡：auto（默认）、off、cuda、cuda:N。环境变量 PAGESIFT_GPU 优先。用不了时退回 CPU，
# 并报 gpu_fallback 警告（auto 在没有 N 卡的机器上用 CPU 不算退回）。
# [gpu]
# mode = "auto"
